name: Kuvryn Ant setup
description: >
  Exchange the job's GitHub OIDC token for a short-lived Kuvryn Ant token and
  point Go, npm/pnpm, cargo and pip (and, opt-in, Maven, NuGet and Composer) at the Ant feeds. No stored secrets. When
  OIDC is unavailable (Dependabot, fork PRs, missing id-token permission) or the
  exchange fails, it warns and leaves the public upstream defaults in place.
inputs:
  host:
    description: Ant host name.
    default: ant.azrty.com
  go:
    description: Configure GOPROXY + netrc for the go feed.
    default: "true"
  npm:
    description: Configure the npm/pnpm registry and auth token for the npm feed.
    default: "true"
  cargo:
    description: Replace crates.io with the cargo sparse feed.
    default: "true"
  pip:
    description: Configure PIP_INDEX_URL / UV_INDEX_URL.
    default: "true"
  maven:
    description: Opt in - write ~/.m2/settings.xml mirroring Maven Central to the maven feed.
    default: "false"
  nuget:
    description: Opt in - write the user NuGet.Config with the Ant nuget feed as the only source.
    default: "false"
  composer:
    description: Opt in - write auth.json and a repositories entry for the composer feed.
    default: "false"
  docker-login:
    description: docker login to the host (needed to push to oci-hosted).
    default: "false"
  required:
    description: Fail the step instead of falling back when no token can be obtained.
    default: "false"
  go-feed:
    default: go
  npm-feed:
    default: npm
  cargo-feed:
    default: cargo
  pypi-feed:
    default: pypi
  maven-feed:
    default: maven
  nuget-feed:
    default: nuget
  composer-feed:
    default: composer
outputs:
  configured:
    description: '"true" when an Ant token was obtained and the tools were configured.'
    value: ${{ steps.setup.outputs.configured }}
runs:
  using: composite
  steps:
    - id: setup
      shell: sh
      env:
        ANT_HOST: ${{ inputs.host }}
        ANT_GO: ${{ inputs.go }}
        ANT_NPM: ${{ inputs.npm }}
        ANT_CARGO: ${{ inputs.cargo }}
        ANT_PIP: ${{ inputs.pip }}
        ANT_MAVEN: ${{ inputs.maven }}
        ANT_NUGET: ${{ inputs.nuget }}
        ANT_COMPOSER: ${{ inputs.composer }}
        ANT_DOCKER: ${{ inputs.docker-login }}
        ANT_REQUIRED: ${{ inputs.required }}
        ANT_GO_FEED: ${{ inputs.go-feed }}
        ANT_NPM_FEED: ${{ inputs.npm-feed }}
        ANT_CARGO_FEED: ${{ inputs.cargo-feed }}
        ANT_PYPI_FEED: ${{ inputs.pypi-feed }}
        ANT_MAVEN_FEED: ${{ inputs.maven-feed }}
        ANT_NUGET_FEED: ${{ inputs.nuget-feed }}
        ANT_COMPOSER_FEED: ${{ inputs.composer-feed }}
      run: sh "$GITHUB_ACTION_PATH/setup.sh"
