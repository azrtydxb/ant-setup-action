name: Kuvryn Ant setup
description: >
  Exchange the job's GitHub OIDC token for a short-lived Kuvryn Ant token and
  point Go, npm/pnpm, cargo and pip (and, opt-in, Maven, NuGet and Composer) at the Ant feeds. No stored secrets. When
  OIDC is unavailable (Dependabot, fork PRs, missing id-token permission) or the
  exchange fails, it warns and leaves the public upstream defaults in place.
inputs:
  host:
    description: Ant host name.
    default: ant.azrty.com
  go:
    description: Configure GOPROXY + netrc for the go feed.
    default: "true"
  npm:
    description: Configure the npm/pnpm registry and auth token for the npm feed.
    default: "true"
  cargo:
    description: Replace crates.io with the cargo sparse feed.
    default: "true"
  pip:
    description: Configure PIP_INDEX_URL / UV_INDEX_URL.
    default: "true"
  maven:
    description: Opt in - write ~/.m2/settings.xml mirroring Maven Central to the maven feed.
    default: "false"
  nuget:
    description: Opt in - write the user NuGet.Config with the Ant nuget feed as the only source.
    default: "false"
  composer:
    description: Opt in - write auth.json and a repositories entry for the composer feed.
    default: "false"
  docker-login:
    description: docker login to the host (needed to push to oci-hosted).
    default: "false"
  build-cache:
    description: >
      Opt in - export buildx registry cache refs (outputs cache-from and cache-to,
      env ANT_CACHE_*), docker login, and (for Rust) install and configure sccache
      against the Ant cache feeds.
    default: "false"
  arch-suffix:
    description: Architecture part of the buildx cache tag. Default derived from the runner (amd64, arm64).
    default: ""
  cache-name:
    description: Optional name inserted in the cache tag (<branch>-<name>-<arch>), for a repository that builds several images.
    default: ""
  cache-branch:
    description: Override the branch part of the cache tag. Default is the PR head branch or ref name (the default branch for tag builds).
    default: ""
  cache-write:
    description: Set "false" to read caches only (cache-to stays empty).
    default: "true"
  sccache:
    description: With build-cache, "true", "false" or "auto" (install when cargo or Cargo.toml is present).
    default: auto
  sccache-version:
    description: sccache release to install when it is missing (checksum verified).
    default: "0.17.0"
  required:
    description: Fail the step instead of falling back when no token can be obtained.
    default: "false"
  cache-feed:
    description: Slug of the OCI cache feed.
    default: buildcache
  sccache-feed:
    description: Slug of the raw cache feed.
    default: sccache
  go-feed:
    default: go
  npm-feed:
    default: npm
  cargo-feed:
    default: cargo
  pypi-feed:
    default: pypi
  maven-feed:
    default: maven
  nuget-feed:
    default: nuget
  composer-feed:
    default: composer
outputs:
  configured:
    description: '"true" when an Ant token was obtained and the tools were configured.'
    value: ${{ steps.setup.outputs.configured }}
  cache-from:
    description: Multi-line value for docker/build-push-action cache-from (empty when build-cache is off or Ant is unavailable).
    value: ${{ steps.setup.outputs.cache-from }}
  cache-to:
    description: Value for docker/build-push-action cache-to (empty when build-cache is off, Ant is unavailable or cache-write is false).
    value: ${{ steps.setup.outputs.cache-to }}
  cache-ref:
    description: Registry repository of the buildx cache, e.g. ant.azrty.com/buildcache/org/repo.
    value: ${{ steps.setup.outputs.cache-ref }}
  cache-tag:
    description: Tag of the cache (<branch>[-<name>]-<arch>).
    value: ${{ steps.setup.outputs.cache-tag }}
  sccache:
    description: '"true" when sccache is installed and pointed at Ant.'
    value: ${{ steps.setup.outputs.sccache }}
runs:
  using: composite
  steps:
    - id: setup
      shell: sh
      env:
        ANT_HOST: ${{ inputs.host }}
        ANT_GO: ${{ inputs.go }}
        ANT_NPM: ${{ inputs.npm }}
        ANT_CARGO: ${{ inputs.cargo }}
        ANT_PIP: ${{ inputs.pip }}
        ANT_MAVEN: ${{ inputs.maven }}
        ANT_NUGET: ${{ inputs.nuget }}
        ANT_COMPOSER: ${{ inputs.composer }}
        ANT_DOCKER: ${{ inputs.docker-login }}
        ANT_REQUIRED: ${{ inputs.required }}
        ANT_BUILD_CACHE: ${{ inputs.build-cache }}
        ANT_ARCH_SUFFIX: ${{ inputs.arch-suffix }}
        ANT_CACHE_NAME: ${{ inputs.cache-name }}
        ANT_CACHE_BRANCH_IN: ${{ inputs.cache-branch }}
        ANT_CACHE_WRITE: ${{ inputs.cache-write }}
        ANT_SCCACHE: ${{ inputs.sccache }}
        ANT_SCCACHE_VERSION: ${{ inputs.sccache-version }}
        ANT_CACHE_FEED: ${{ inputs.cache-feed }}
        ANT_SCCACHE_FEED: ${{ inputs.sccache-feed }}
        ANT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        ANT_GO_FEED: ${{ inputs.go-feed }}
        ANT_NPM_FEED: ${{ inputs.npm-feed }}
        ANT_CARGO_FEED: ${{ inputs.cargo-feed }}
        ANT_PYPI_FEED: ${{ inputs.pypi-feed }}
        ANT_MAVEN_FEED: ${{ inputs.maven-feed }}
        ANT_NUGET_FEED: ${{ inputs.nuget-feed }}
        ANT_COMPOSER_FEED: ${{ inputs.composer-feed }}
      run: sh "$GITHUB_ACTION_PATH/setup.sh"
