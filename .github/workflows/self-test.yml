name: self-test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sh test/lib_test.sh
  # All jobs run on GitHub-hosted runners (public repo policy). The jobs that test the
  # action itself run on the runner and install the toolchain they need; a job with
  # `container:` would not see the checkout for the local action (`uses: ./`).
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "1.27", cache: false }
      - uses: ./
        with: { required: "true" }
      - run: |
          go env GOPROXY
          cd "$(mktemp -d)" && go mod init t && go get github.com/pkg/errors@v0.9.1 && echo go-ok
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - uses: ./
        with: { required: "true" }
      - run: |
          npm config get registry
          cd "$(mktemp -d)" && npm init -y >/dev/null && npm install left-pad@1.3.0 && echo npm-ok
          # packuments over 16 MiB stream since Ant 0.1.0-375611f
          cd "$(mktemp -d)" && npm init -y >/dev/null && npm install --ignore-scripts playwright-core && echo npm-large-ok
          npm install -g pnpm@9 >/dev/null && pnpm add is-number@7.0.0 && echo pnpm-ok
  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: stable }
      - uses: ./
        with: { required: "true" }
      - run: |
          cd "$(mktemp -d)" && cargo new -q t && cd t && cargo add -q itoa@1.0.11 && cargo fetch && echo cargo-ok
  pip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - uses: ./
        with: { required: "true" }
      - run: |
          python -m pip download --no-deps -d "$(mktemp -d)" six==1.16.0 && echo pip-ok
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # buildx pushes with the docker CLI's credentials, which docker-login below writes.
      - id: builder
        uses: docker/setup-buildx-action@v4
      - uses: ./
        with:
          {
            required: "true",
            docker-login: "true",
            go: "false",
            npm: "false",
            cargo: "false",
            pip: "false",
          }
      - name: Tag and Dockerfile
        id: img
        run: |
          printf 'FROM busybox:1.37\nLABEL org.opencontainers.image.source=https://github.com/azrtydxb/ant-setup-action\n' > Dockerfile.selftest
          # oci-hosted tags are immutable and a rebuilt image has a new digest, so tag per run
          # (a workflow_dispatch or re-run on the same commit would otherwise conflict).
          echo "tag=$ANT_HOST/oci-hosted/azrtydxb/ant-setup-selftest:${GITHUB_SHA::7}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Push a tiny image to oci-hosted (main gets publish)
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.builder.outputs.name }}
          context: .
          file: Dockerfile.selftest
          platforms: linux/amd64,linux/arm64
          push: true
          # A plain image manifest, as the classic docker build pushed (no attestations).
          provenance: false
          tags: ${{ steps.img.outputs.tag }}
  slim-node:
    # A slim image has neither curl nor wget, so the action must reach Ant through node.
    # The runner has curl: hide it (and wget) for the rest of this ephemeral job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - name: Hide curl and wget
        run: |
          for d in $(echo "$PATH" | tr : ' '); do
            for t in curl wget; do
              if [ -e "$d/$t" ]; then sudo mv "$d/$t" "$d/$t.hidden"; fi
            done
          done
          hash -r
          if command -v curl || command -v wget; then exit 1; fi
      - uses: ./
        with: { required: "true" }
      - run: cd "$(mktemp -d)" && npm init -y >/dev/null && npm install left-pad@1.3.0 && echo slim-npm-ok
  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      # Maven 3.9, as in the old maven:3.9 container.
      - name: Install Maven 3.9
        env:
          MAVEN_VERSION: 3.9.11
          MAVEN_SHA512: bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978
        run: |
          tgz="$RUNNER_TEMP/maven.tar.gz"
          curl -fsSL -o "$tgz" "https://archive.apache.org/dist/maven/maven-3/$MAVEN_VERSION/binaries/apache-maven-$MAVEN_VERSION-bin.tar.gz"
          echo "$MAVEN_SHA512  $tgz" | sha512sum -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-$MAVEN_VERSION/bin" >> "$GITHUB_PATH"
      - uses: ./
        with:
          {
            required: "true",
            maven: "true",
            go: "false",
            npm: "false",
            cargo: "false",
            pip: "false",
          }
      - run: |
          grep -c 'feeds/maven/maven' ~/.m2/settings.xml
          mvn -B -q dependency:get -Dartifact=junit:junit:4.13.2 && echo maven-ok
  nuget:
    runs-on: ubuntu-latest
    env:
      # The runner image may lack ICU.
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: "8.0.x" }
      - uses: ./
        with:
          {
            required: "true",
            nuget: "true",
            go: "false",
            npm: "false",
            cargo: "false",
            pip: "false",
          }
      - run: |
          dotnet nuget list source
          cd "$(mktemp -d)" && dotnet new classlib -o t >/dev/null && cd t && dotnet add package Newtonsoft.Json --version 13.0.3 && echo nuget-ok
  composer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install PHP and Composer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends php-cli php-curl php-zip unzip composer
      - uses: ./
        with:
          {
            required: "true",
            composer: "true",
            go: "false",
            npm: "false",
            cargo: "false",
            pip: "false",
          }
      - run: |
          composer config --global repositories
          cd "$(mktemp -d)" && composer init -n --name=t/t >/dev/null && composer require --no-interaction psr/log:3.0.0 && echo composer-ok
