name: build-cache-test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
env:
  # One cache identity per run, so the second pass reads exactly what the first wrote
  # and the cleanup step has something to delete without touching real branches.
  CACHE_BRANCH: selftest-${{ github.run_id }}
jobs:
  docker-write:
    runs-on: arc-azrtydxb
    steps:
      - uses: actions/checkout@v5
      # The runner pod's own BuildKit sidecar, the builder consumers use. Runner pods are
      # ephemeral, so its local store starts empty in every job.
      - id: builder
        uses: azrtydxb/.github/actions/setup-builder@d021f2ca9fa3d6682085a7d069b7c8b1dc7b9b80 # main
      - id: ant
        uses: ./
        with:
          required: "true"
          build-cache: "true"
          cache-branch: ${{ env.CACHE_BRANCH }}
          go: "false"
          npm: "false"
          cargo: "false"
          pip: "false"
      - name: Outputs are set
        run: |
          printf 'ref=%s\ntag=%s\nfrom=%s\nto=%s\n' "$REF" "$TAG" "$FROM" "$TO"
          # cache-from is empty on the first run: the cache does not exist yet
          [ -n "$TO" ] && [ -n "$REF" ]
        env:
          REF: ${{ steps.ant.outputs.cache-ref }}
          TAG: ${{ steps.ant.outputs.cache-tag }}
          FROM: ${{ steps.ant.outputs.cache-from }}
          TO: ${{ steps.ant.outputs.cache-to }}
      - name: Write the Dockerfile
        run: |
          cat > Dockerfile.cachetest <<'DOCKERFILE'
          FROM busybox:1.37
          RUN head -c 3000000 /dev/urandom > /blob1
          RUN echo layer-two > /two
          DOCKERFILE
      - name: Build with the cache (cold, exports it)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          builder: ${{ steps.builder.outputs.name }}
          context: .
          file: Dockerfile.cachetest
          # No image output: the cache export to Ant is what this job tests.
          tags: cachetest:write
          cache-from: ${{ steps.ant.outputs.cache-from }}
          cache-to: ${{ steps.ant.outputs.cache-to }}
  docker-read:
    # A different job means a different runner pod, so a fresh BuildKit sidecar with an
    # empty store: anything CACHED comes from Ant.
    needs: docker-write
    runs-on: arc-azrtydxb
    steps:
      - uses: actions/checkout@v5
      - id: builder
        uses: azrtydxb/.github/actions/setup-builder@d021f2ca9fa3d6682085a7d069b7c8b1dc7b9b80 # main
      - id: ant
        uses: ./
        with:
          required: "true"
          build-cache: "true"
          cache-branch: ${{ env.CACHE_BRANCH }}
          go: "false"
          npm: "false"
          cargo: "false"
          pip: "false"
      - name: Second build shows CACHED steps
        run: |
          cat > Dockerfile.cachetest <<'DOCKERFILE'
          FROM busybox:1.37
          RUN head -c 3000000 /dev/urandom > /blob1
          RUN echo layer-two > /two
          DOCKERFILE
          set --
          while IFS= read -r line; do
            [ -n "$line" ] && set -- "$@" --cache-from "$line"
          done <<EOF
          $ANT_CACHE_FROM
          EOF
          docker buildx build --builder "$BUILDER" --progress=plain "$@" -f Dockerfile.cachetest -t cachetest:read . 2>&1 | tee build.log
          n=$(grep -c ' CACHED' build.log || true)
          echo "CACHED steps: $n"
          [ -n "$ANT_CACHE_FROM" ]
          [ "$n" -ge 2 ]
        env:
          BUILDER: ${{ steps.builder.outputs.name }}
  sccache:
    runs-on: arc-azrtydxb
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v5
      - id: ant
        uses: ./
        with:
          required: "true"
          build-cache: "true"
          go: "false"
          npm: "false"
          pip: "false"
      - name: Compile a crate twice
        run: |
          [ "$RUSTC_WRAPPER" = "sccache" ]
          cd "$(mktemp -d)" && cargo new -q --lib t && cd t && cargo add -q itoa@1.0.11
          cargo build -q
          sccache --zero-stats >/dev/null
          cargo clean -q
          cargo build -q
          sccache --show-stats
      - name: sccache hits
        uses: ./cache-stats
        with:
          min-hits: "1"
  cleanup:
    needs: docker-read
    runs-on: arc-azrtydxb
    steps:
      - uses: actions/checkout@v5
      - id: clean
        uses: ./cache-cleanup
        with:
          branch: ${{ env.CACHE_BRANCH }}
          required: "true"
      - name: The test cache was removed
        run: |
          echo "tags removed: $TAGS"
          [ "${TAGS:-0}" -ge 1 ]
        env:
          TAGS: ${{ steps.clean.outputs.tags-removed }}
  sccache-hosted:
    # A GitHub-hosted runner: non-root, /usr/local/bin not writable, no container.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        with:
          required: "true"
          build-cache: "true"
          go: "false"
          npm: "false"
          cargo: "false"
          pip: "false"
      - name: Compile a crate twice
        run: |
          [ "$RUSTC_WRAPPER" = "sccache" ]
          command -v sccache
          cd "$(mktemp -d)" && cargo new -q --lib t && cd t
          cargo build -q
          sccache --zero-stats >/dev/null
          cargo clean -q
          cargo build -q
          sccache --show-stats
      - name: sccache hits
        uses: ./cache-stats
        with:
          min-hits: "1"
